global
  log stdout format raw local0
defaults
  mode http
  log global
  option httplog
  timeout connect 3s
  timeout client  30s
  timeout server  30s

frontend fe_api
  bind *:8080
  default_backend be_api

backend be_api
  balance roundrobin
  option httpchk GET /api/observability/health
  http-check expect status 200
  http-response set-header X-LB-Backend %[srv_name]
  server api1 api1:8000 check inter 1s fall 2 rise 2
  server api2 api2:8000 check inter 1s fall 2 rise 2
  server api3 api3:8000 check inter 1s fall 2 rise 2
  server api4 api4:8000 check inter 1s fall 2 rise 2
  server api5 api5:8000 check inter 1s fall 2 rise 2
  server api6 api6:8000 check inter 1s fall 2 rise 2


listen stats
  bind *:8404
  stats enable
  stats uri /
  stats refresh 2s
