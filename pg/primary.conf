listen_addresses = '*'
max_connections = 300          # worst case every pool lands on one node: 8 workers x 30 conns = 240
wal_level = replica            # ships enough WAL for a physical standby
max_wal_senders = 10           # one per connected standby, plus headroom
max_replication_slots = 10     # slots pin WAL until the standby has it
wal_keep_size = 512MB          # safety net if a slot is dropped
hot_standby = on               # standbys accept read queries
wal_log_hints = on             # required later for pg_rewind
archive_mode = off             # not needed for streaming-only lab

# make lag visible in the logs
log_min_duration_statement = 500ms